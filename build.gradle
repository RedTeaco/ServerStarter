plugins {
    id 'java'
    id "org.jetbrains.kotlin.jvm" version "2.4.20"
    id "com.gradleup.shadow" version "9.6.1"
    id "com.github.breadmoirai.github-release" version "2.5.2"
    id "io.github.ben-manes.versions" version "0.63.0"
}

group = 'tk.redteaco'
version = '2.5.3'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(8)
    }
}

repositories {
    mavenCentral()

    maven {
        name = 'DVS1'
        url = 'https://dvs1.progwml6.com/files/maven'
    }
}

dependencies {
    testImplementation  'junit:junit:4.13.2'

    implementation  'org.yaml:snakeyaml:2.2'

    implementation  'commons-io:commons-io:2.14.0'
    implementation  'com.squareup.okhttp3:okhttp:4.9.3'

    implementation  'com.google.code.gson:gson:2.9.1'

    implementation ("org.jetbrains.kotlin:kotlin-stdlib-jdk8")

    // https://mvnrepository.com/artifact/org.fusesource.jansi/jansi
    implementation  'org.fusesource.jansi:jansi:2.3.4'
}

shadowJar {
    archiveClassifier.set("")
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

jar {
    manifest {
        attributes(
                'Class-Path': configurations.runtimeClasspath.collect { it.getName() }.join(' '),
                'Main-Class': 'atm.bloodworkxgaming.serverstarter.ServerStarterKt'
        )
    }
}

processResources {
    def projectVersion = project.version
    filesMatching('version.properties') {
        expand(version: projectVersion)
    }
    inputs.property('version', projectVersion)
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.build.dependsOn shadowJar


tasks.register('copyJar', Copy) {
    dependsOn build


//    from file("$buildDir/libs/ServerStarter-${version}.jar")
    from tasks.shadowJar.archiveFile
    into file("$buildDir/dist/serverstarter-$version/")
}

tasks.register('packageDist', Copy) {
    group = "build"
    dependsOn copyJar

    from file("src/main/resources/startserver.bat")
    from file("src/main/resources/startserver.sh")
    from file("server-setup-config.yaml")


    into file("$buildDir/dist/serverstarter-$version/")

    filter { it.replaceAll("@@serverstarter-libVersion@@", version as String) }
    doLast {
        File shScript = file("$buildDir/dist/serverstarter-$version/startserver.sh")
        String content = shScript.text
        if (content.contains("\r\n")) {
            content = content.replace("\r\n", "\n")
            shScript.write(content)
            println "Converted line endings in $shScript"
        }
    }
}

tasks.register('zipDist', Zip) {
    dependsOn packageDist
    group = "build"

    archiveFileName = "serverstarter-${version}.zip"
    destinationDirectory = (file("$buildDir/release/"))

    from layout.buildDirectory.dir("dist/serverstarter-$version/")
}


githubRelease {
    token = getGithubKey()
    owner = "EdenLeaf"
    repo = "ServerStarter"
    targetCommitish = "master"
    overwrite = true

    releaseAssets ("$buildDir/libs/ServerStarter-${version}.jar",file("$buildDir/release/serverstarter-${version}.zip"))
}

tasks.githubRelease.dependsOn zipDist

static String getGithubKey(){
    if (new File('secrets.properties').exists()) {

        Properties props = new Properties()
        props.load(new FileInputStream(new File('secrets.properties')))
        return props['GITHUB_TOKEN']
    }

    return ""
}

tasks.register('depsize') {
    group = "help"
    doLast {
        def size = 0
        def formatStr = "%,10.2f"
        configurations.default.collect { it.length() / (1024 * 1024) }.each { size += it }

        def out = new StringBuffer()
        out << 'Total dependencies size:'.padRight(45)
        out << "${String.format(formatStr, size)} Mb\n\n"

        configurations
                .default
                .sort { -it.length() }
                .each {
                    out << "${it.name}".padRight(45)
                    out << "${String.format(formatStr, (it.length() / 1024))} kb\n"
                }
        println(out)
    }
}